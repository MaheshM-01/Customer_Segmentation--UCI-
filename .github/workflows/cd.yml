name: CD Pipeline & Model Quality Gate

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      retrain_model:
        description: 'Execute end-to-end retraining with MLflow tracking'
        required: false
        default: 'false'
        type: boolean

jobs:
  model-quality-gate:
    name: Model Quality Gate & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Retrain Model & MLflow Tracking (if triggered)
        if: ${{ inputs.retrain_model == true }}
        run: |
          uv run python -m src.pipeline.train_pipeline --skip-market-basket

      - name: Validate Production Models & Drift Baselines
        run: |
          python -c "
          from src.pipeline.inference_pipeline import get_inference_service
          service = get_inference_service()
          assert service.kmeans is not None, 'KMeans model failed to load'
          assert service.preprocessor is not None, 'Preprocessor failed to load'
          assert len(service.cluster_profiles) == 4, 'Cluster profiles mismatch'
          print('Model artifacts successfully validated!')
          "

  docker-build:
    name: Container Build & Health Check
    runs-on: ubuntu-latest
    needs: model-quality-gate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t customer-segmentation-api:latest -f deployment/Dockerfile .

      - name: Verify Container Execution & Healthcheck
        run: |
          docker run -d --name test-api -p 8000:8000 customer-segmentation-api:latest
          sleep 5
          docker ps
          curl --fail http://localhost:8000/health || (docker logs test-api && exit 1)
          docker stop test-api
